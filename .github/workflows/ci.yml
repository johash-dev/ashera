name: CI

on:
  pull_request:
    # labeled/unlabeled: re-run when the owner adds or removes `gate-change`.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Inside the required `verify` job on purpose: a separate failing job would skip `verify`,
      # and GitHub treats a skipped required check as passing.
      - name: Integrity (no weakened gates without the owner's gate-change label)
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/integrity-check.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify (typecheck, lint, docs, unit, build, e2e incl. @visual)
        run: npm run verify -- --ci
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
