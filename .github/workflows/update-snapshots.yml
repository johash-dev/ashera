name: Update visual snapshots

# Run manually on a feature branch when a visual change is intended (Actions → Update visual
# snapshots → Run workflow → pick the branch). Regenerates Linux baselines and commits them.
# Commits pushed by GITHUB_TOKEN don't trigger CI, so this workflow starts CI on the branch itself.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # =all rewrites every baseline; the bare flag (=changed) keeps any that still "match" within
      # tolerance, so an intended change could leave stale baselines behind.
      - name: Regenerate @visual baselines
        run: npx playwright test --grep @visual --update-snapshots=all
        env:
          CI: 'true'
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test: update visual snapshot baselines"
            git push
            gh workflow run ci.yml --ref "${{ github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
