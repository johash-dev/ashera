name: Update visual snapshots

# Regenerates the Linux @visual baselines for a feature branch and uploads them as the `baselines`
# artifact. It does not commit: the agent downloads the artifact, commits it under the owner's
# identity and pushes, so CI runs on the PR as usual (GITHUB_TOKEN commits don't trigger CI).
#   gh workflow run update-snapshots.yml --ref <branch>
#   gh run download <run-id> -n baselines -D e2e/__screenshots__
# See docs/testing.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # =all rewrites every baseline; the bare flag (=changed) keeps any that still "match" within
      # tolerance, so an intended change could leave stale baselines behind.
      - name: Regenerate @visual baselines
        run: npx playwright test --grep @visual --update-snapshots=all
        env:
          CI: 'true'
      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: e2e/__screenshots__/
          retention-days: 7
